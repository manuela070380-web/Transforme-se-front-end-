<h2>Meu formulário</h2>
<p>Preenche as informações abaixo</p>
<form id="formRegister">
    Nome:
    <input id="iName" type="text" placeholder="Digite seu nome completo" /><br>
    Email: <input id="iEmail" type="email" placeholder="Digite seu melhor email" /><br>
    Senha: <input id="iPass" type="password" placeholder="Letra maiúscula e números" /><br>
    Data de nascimento: <input id="iBirth" type="date" />
    <button type="submit">Salvar</button>

</form>




<h2>Resposta</h2>

<pre id="pResponse"></pre>

<form id="formLogin">
    Email: <input id="iEmaillogin" type="email" placeholder="Digite seu email de cadastro" /><br>
    Senha: <input id="iPasslogin" type="password" placeholder="Letra maiúscula e números" /><br>
    <button type="submit">Entrar</button>
</form>
